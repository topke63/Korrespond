<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56b9f0"/>
      <stop offset="1" stop-color="#1d8fd8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef7"/>
    </linearGradient>
  </defs>
  <!-- rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" ry="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <!-- soft shadow under the envelope -->
  <rect x="22" y="35" width="84" height="62" rx="10" ry="10" fill="#0b4f80" fill-opacity="0.35" transform="translate(0 4)"/>
  <!-- envelope body -->
  <rect x="22" y="33" width="84" height="62" rx="10" ry="10" fill="url(#paper)"/>
  <!-- flap -->
  <path d="M27 41 L64 70 L101 41" fill="none" stroke="#1d8fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- unread dot -->
  <circle cx="98" cy="30" r="17" fill="#f67400"/>
  <circle cx="98" cy="30" r="17" fill="none" stroke="#ffffff" stroke-width="4"/>
</svg>
